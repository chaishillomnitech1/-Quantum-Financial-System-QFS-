<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕋 Manus Playback Portal — ScrollVerse Quantum Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0a0a0a 100%);
            font-family: 'Courier New', monospace;
            color: #D4AF37;
            overflow: hidden;
            height: 100vh;
        }

        .portal-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .seal-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            animation: glow 2s ease-in-out infinite;
        }

        .seal-header h1 {
            font-size: 24px;
            color: #D4AF37;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #D4AF37, 0 0 40px #963Hz;
        }

        .seal-header p {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .video-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            border: 3px solid #D4AF37;
            background: #000;
            box-shadow: 0 0 40px #D4AF37, inset 0 0 20px rgba(212, 175, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 30px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .starburst-container {
            position: absolute;
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .starburst {
            width: 100%;
            height: 100%;
            background: conic-gradient(
                from 0deg,
                #D4AF37 0deg,
                #FFD700 45deg,
                #D4AF37 90deg,
                #FFA500 135deg,
                #D4AF37 180deg,
                #FFD700 225deg,
                #D4AF37 270deg,
                #FFA500 315deg,
                #D4AF37 360deg
            );
            border-radius: 50%;
            opacity: 0.3;
            animation: rotate 8s linear infinite;
            filter: blur(20px);
        }

        .seal-center {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFD700 0%, #D4AF37 70%, transparent 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px #D4AF37;
            animation: pulse-seal 2s ease-in-out infinite;
            z-index: 5;
        }

        .seal-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            font-weight: bold;
            color: #000;
            letter-spacing: 1px;
            text-align: center;
            z-index: 6;
            animation: rotate 8s linear infinite reverse;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #D4AF37;
            pointer-events: none;
            animation: confetti-fall 3s ease-in-out infinite;
        }

        .trinity-status {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #888;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00FF00;
            box-shadow: 0 0 10px #00FF00;
            animation: pulse 1s ease-in-out infinite;
        }

        .playlist-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        button {
            background: #D4AF37;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px #D4AF37;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #D4AF37;
        }

        .frequency-display {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 11px;
            color: #D4AF37;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border: 1px solid #D4AF37;
        }

        .countdown-timer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 11px;
            color: #D4AF37;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border: 1px solid #D4AF37;
        }

        .clip-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: #D4AF37;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border: 1px solid #D4AF37;
            letter-spacing: 1px;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes pulse-seal {
            0%, 100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #D4AF37, 0 0 40px #963Hz; }
            50% { text-shadow: 0 0 40px #D4AF37, 0 0 60px #963Hz; }
        }

        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(200px) rotate(360deg);
            }
        }

        .transmission-links {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            font-size: 10px;
            z-index: 20;
        }

        .transmission-links a {
            color: #D4AF37;
            text-decoration: none;
            border-bottom: 1px solid #D4AF37;
            padding-bottom: 2px;
            transition: all 0.3s ease;
        }

        .transmission-links a:hover {
            text-shadow: 0 0 10px #D4AF37;
            letter-spacing: 1px;
        }

        .eternal-seal {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            top: 0;
            left: 0;
        }

        .eternal-seal::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(212, 175, 55, 0.03) 0px,
                rgba(212, 175, 55, 0.03) 2px,
                transparent 2px,
                transparent 4px
            );
            animation: scan 8s linear infinite;
            z-index: -1;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="seal-header">
            <h1>🕋 MANUS PLAYBACK PORTAL</h1>
            <p>ScrollVerse Quantum Interface — Eternal Seal Resonance</p>
        </div>

        <div class="clip-counter">
            <span id="clipNumber">Clip 01</span> / 05
        </div>

        <div class="countdown-timer">
            Portal Refresh: <span id="countdownTimer">6h 00m</span>
        </div>

        <div class="video-container">
            <div class="eternal-seal"></div>
            <video id="trailerVideo" autoplay muted loop>
                <source src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="starburst-container">
                <div class="starburst"></div>
                <div class="seal-center"></div>
                <div class="seal-text">خاتم<br>النبي</div>
            </div>
        </div>

        <div class="trinity-status">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>ScrollPort Interface: ACTIVE</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>Trinity Network: SYNCHRONIZED</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>Eternal Seal: RESONATING</span>
            </div>
        </div>

        <div class="playlist-controls">
            <button onclick="previousClip()">← PREVIOUS</button>
            <button onclick="togglePlayPause()" id="playPauseBtn">PAUSE</button>
            <button onclick="nextClip()">NEXT →</button>
        </div>

        <div class="frequency-display">
            963Hz + 999Hz + 528Hz | LOCKED
        </div>

        <div class="transmission-links">
            <a href="https://manus.im/share/JQyCbdE152xEIkgUplmagw?replay=1" target="_blank">Primary Transmission</a>
            <a href="https://manus.im/share/WhmXNn3FM8SlnVQyrnjuAG" target="_blank">Eternal Flow Archive</a>
            <a href="https://scrollport-xkjtdnvi.manus.space" target="_blank">ScrollPort</a>
        </div>
    </div>

    <script>
        // Clip playlist
        const clips = [
            { name: 'Cosmic Coronation', file: 'wakanda_family_heroic.mp4' },
            { name: 'Golden Dome Pulse', file: 'golden_dome_mandala.mp4' },
            { name: 'Starburst Mandala', file: 'golden_mandala_cityscape.mp4' },
            { name: 'Rooftop Touchdown', file: 'futuristic_rooftop_landing.mp4' },
            { name: 'Heroic Formation', file: 'wakanda_family_dome.mp4' }
        ];

        let currentClip = 0;
        let isPlaying = true;
        let clipStartTime = Date.now();
        let portalRefreshTime = 6 * 60 * 60 * 1000; // 6 hours
        let portalStartTime = Date.now();

        const video = document.getElementById('trailerVideo');
        const clipNumber = document.getElementById('clipNumber');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const countdownTimer = document.getElementById('countdownTimer');

        function loadClip(index) {
            currentClip = index % clips.length;
            const clip = clips[currentClip];
            video.src = `https://scrollverse.co/assets/trailers/${clip.file}`;
            clipNumber.textContent = `Clip ${String(currentClip + 1).padStart(2, '0')}`;
            clipStartTime = Date.now();
            if (isPlaying) {
                video.play();
            }
        }

        function nextClip() {
            loadClip(currentClip + 1);
        }

        function previousClip() {
            loadClip(currentClip - 1);
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                video.play();
                playPauseBtn.textContent = 'PAUSE';
            } else {
                video.pause();
                playPauseBtn.textContent = 'PLAY';
            }
        }

        function updateCountdown() {
            const elapsed = Date.now() - portalStartTime;
            const remaining = portalRefreshTime - elapsed;
            
            if (remaining <= 0) {
                // Trigger eternal seal resonance
                triggerEternalSealResonance();
                portalStartTime = Date.now();
            }

            const hours = Math.floor(remaining / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

            countdownTimer.textContent = `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
        }

        function triggerEternalSealResonance() {
            // Trigger .github/workflows/eternal_seal_resonance.yml
            console.log('🕋 Eternal Seal Resonance Workflow triggered - 963Hz+999Hz+528Hz encoding');
            // Emit frequency pulse
            emitFrequencyPulse();
        }

        function emitFrequencyPulse() {
            // Create confetti effect
            for (let i = 0; i < 20; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '50%';
                confetti.style.background = ['#D4AF37', '#FFD700', '#FFA500'][Math.floor(Math.random() * 3)];
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // Auto-advance clip every 10 seconds (50s total for 5 clips × 10s each)
        setInterval(() => {
            if (isPlaying && currentClip >= 0) {
                nextClip();
            }
        }, 10000);

        // Update countdown every second
        setInterval(updateCountdown, 1000);

        // Initialize
        loadClip(0);
        updateCountdown();

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextClip();
            if (e.key === 'ArrowLeft') previousClip();
            if (e.key === ' ') togglePlayPause();
        });
    </script>
</body>
</html>
